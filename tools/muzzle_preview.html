<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Muzzle Flash Preview — polar starburst PS</title>
<style>
  :root { --bg:#0b0d12; --panel:#151922; --ink:#dfe6f0; --dim:#8a93a6; --acc:#ffcf6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
         display:flex; height:100vh; overflow:hidden; }
  #stage { flex:1; display:flex; align-items:center; justify-content:center; position:relative; }
  canvas { background:#000; image-rendering:auto; box-shadow:0 0 0 1px #222 inset; }
  #hint { position:absolute; top:10px; left:12px; color:var(--dim); font-size:11px; }
  #panel { width:330px; background:var(--panel); border-left:1px solid #222;
           padding:14px 16px; overflow-y:auto; }
  h1 { font-size:13px; margin:0 0 4px; letter-spacing:.02em; }
  .sub { color:var(--dim); font-size:11px; margin:0 0 14px; }
  .row { margin:0 0 11px; }
  .row label { display:flex; justify-content:space-between; align-items:baseline; }
  .row .nm { color:var(--ink); }
  .row .vl { color:var(--acc); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; margin-top:5px; accent-color:var(--acc); }
  .grp { border-top:1px solid #232838; margin:14px 0 12px; padding-top:12px; }
  .grp h2 { font-size:11px; color:var(--dim); text-transform:uppercase;
            letter-spacing:.08em; margin:0 0 10px; }
  .chk { display:flex; align-items:center; gap:8px; margin:0 0 11px; color:var(--ink); }
  .chk input { accent-color:var(--acc); }
  .swatch { display:flex; gap:8px; align-items:center; margin:0 0 11px; }
  .swatch input[type=color] { width:38px; height:24px; border:none; background:none; padding:0; }
  pre { background:#0c0f16; border:1px solid #232838; border-radius:6px;
        padding:10px; color:#bcd; font-size:11px; line-height:1.5; overflow-x:auto;
        white-space:pre; margin:8px 0 0; }
  .copy { margin-top:6px; background:#222a3a; color:var(--ink); border:1px solid #333d52;
          border-radius:5px; padding:5px 10px; cursor:pointer; font:inherit; font-size:11px; }
  .copy:hover { background:#2c3550; }
  button.preset { background:#1c2230; color:var(--ink); border:1px solid #2c3346;
          border-radius:5px; padding:4px 9px; cursor:pointer; font:inherit; font-size:11px; margin:0 5px 5px 0; }
  button.preset:hover { background:#283150; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="cv" width="560" height="560"></canvas>
    <div id="hint">검은 배경 = 0, 밝은 곳 = intensity (HDR는 exposure로 압축 표시)</div>
  </div>

  <div id="panel">
    <h1>Muzzle Flash — polar PS</h1>
    <p class="sub">HLSL과 1:1. 잠근 값을 아래 readout에서 그대로 복사.</p>

    <div class="grp">
      <h2>Rays (빛살)</h2>
      <div class="row" data-k="N">
        <label><span class="nm">N — <code>cos(a*N)</code></span><span class="vl"></span></label>
        <input type="range" min="1" max="12" step="0.5" value="3">
        <span style="color:var(--dim);font-size:11px">빛살 = 2×N 갈래</span>
      </div>
      <div class="row" data-k="rayExp">
        <label><span class="nm">ray 지수 — <code>pow(rays, x)</code></span><span class="vl"></span></label>
        <input type="range" min="1" max="40" step="0.5" value="8">
      </div>
      <div class="row" data-k="seed">
        <label><span class="nm">seed — 위상 회전</span><span class="vl"></span></label>
        <input type="range" min="0" max="6.283" step="0.01" value="0">
      </div>
      <div class="chk">
        <input type="checkbox" id="rayLife">
        <label for="rayLife">ray 지수를 life로 구동 <code>lerp(6,14,1-life)</code></label>
      </div>
    </div>

    <div class="grp">
      <h2>Radial &amp; Core</h2>
      <div class="row" data-k="radialExp">
        <label><span class="nm">radial 지수 — <code>pow(1-r, x)</code></span><span class="vl"></span></label>
        <input type="range" min="1" max="6" step="0.1" value="1">
      </div>
      <div class="row" data-k="coreMul">
        <label><span class="nm">core 크기 — <code>1 - r*x</code></span><span class="vl"></span></label>
        <input type="range" min="1" max="4" step="0.05" value="1.6">
        <span style="color:var(--dim);font-size:11px">클수록 코어 작아짐</span>
      </div>
      <div class="row" data-k="coreExp">
        <label><span class="nm">core 지수 — <code>pow(.., x)</code></span><span class="vl"></span></label>
        <input type="range" min="1" max="10" step="0.5" value="4">
      </div>
    </div>

    <div class="grp">
      <h2>Life &amp; Look</h2>
      <div class="chk">
        <input type="checkbox" id="animLife" checked>
        <label for="animLife">life 애니메이션 (피었다 꺼짐, ~0.18s 루프)</label>
      </div>
      <div class="row" data-k="life">
        <label><span class="nm">life (수동, 애니 끄면)</span><span class="vl"></span></label>
        <input type="range" min="0" max="1" step="0.01" value="1">
      </div>
      <div class="row" data-k="exposure">
        <label><span class="nm">exposure (HDR 표시 압축)</span><span class="vl"></span></label>
        <input type="range" min="0.2" max="4" step="0.05" value="1">
      </div>
      <div class="swatch">
        <input type="color" id="tint" value="#fff2b3">
        <label for="tint">tint (SetStartColor에 해당)</label>
      </div>
    </div>

    <div class="grp">
      <h2>Presets</h2>
      <button class="preset" data-p="star8">8갈래 별</button>
      <button class="preset" data-p="cross">십자(샤프)</button>
      <button class="preset" data-p="flower">꽃잎(뭉툭)</button>
      <button class="preset" data-p="spark">스파크 번쩍</button>
    </div>

    <div class="grp">
      <h2>HLSL 상수 (복사)</h2>
      <pre id="out"></pre>
      <button class="copy" id="copyBtn">복사</button>
    </div>
  </div>

<script>
const cv = document.getElementById('cv');
const gl = cv.getContext('webgl', { premultipliedAlpha:false, alpha:false });

const VS = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }
`;

// Fragment shader — mirrors the HLSL PSMain exactly.
const FS = `
precision highp float;
varying vec2 vUv;
uniform float uN, uRayExp, uSeed, uRayLife;     // rays
uniform float uRadialExp, uCoreMul, uCoreExp;   // radial + core
uniform float uLife, uExposure;
uniform vec3  uTint;

void main(){
  vec2 p = vUv*2.0 - 1.0;
  float r = length(p);
  float a = atan(p.y, p.x);

  float radial = clamp(1.0 - r, 0.0, 1.0);
  radial = pow(radial, uRadialExp);

  // ray exponent: constant, or driven by life like lerp(6,14,1-life)
  float rayExp = mix(uRayExp, mix(6.0, 14.0, 1.0 - uLife), uRayLife);
  float rays = abs(cos(a * uN + uSeed));
  rays = pow(rays, rayExp);

  float core = pow(clamp(1.0 - r*uCoreMul, 0.0, 1.0), uCoreExp);

  float starburst = rays * radial;
  float intensity = clamp(core + starburst, 0.0, 1.0);
  intensity *= uLife;

  // HDR-ish view: scale by exposure, tonemap so >1 reads as white-hot (bloom feel)
  vec3 hdr = uTint * intensity * uExposure;
  vec3 disp = hdr / (1.0 + hdr);          // Reinhard, approximates additive bloom rolloff
  gl_FragColor = vec4(disp, 1.0);
}
`;

function sh(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog,'aPos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const U = {};
['uN','uRayExp','uSeed','uRayLife','uRadialExp','uCoreMul','uCoreExp','uLife','uExposure','uTint']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));

// ---- state wiring ----
const rows = {};
document.querySelectorAll('.row[data-k]').forEach(r => {
  rows[r.dataset.k] = r.querySelector('input');
});
const rayLife  = document.getElementById('rayLife');
const animLife = document.getElementById('animLife');
const tintEl   = document.getElementById('tint');
const out      = document.getElementById('out');

function hexToRgb(h){ return [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255]; }

function val(k){ return parseFloat(rows[k].value); }

function syncLabels(){
  document.querySelectorAll('.row[data-k]').forEach(r=>{
    r.querySelector('.vl').textContent = (+r.querySelector('input').value).toFixed(2);
  });
}

const presets = {
  star8:  { N:4,   rayExp:8,  radialExp:1,   coreMul:1.6, coreExp:4, seed:0 },
  cross:  { N:2,   rayExp:22, radialExp:1.4, coreMul:2.0, coreExp:5, seed:0.0 },
  flower: { N:5,   rayExp:3,  radialExp:1.2, coreMul:1.4, coreExp:3, seed:0.3 },
  spark:  { N:3,   rayExp:14, radialExp:2.2, coreMul:2.4, coreExp:6, seed:1.1 },
};
document.querySelectorAll('button.preset').forEach(b=>{
  b.onclick = ()=>{ const p=presets[b.dataset.p];
    for(const k in p){ rows[k].value = p[k]; } syncLabels(); };
});

let t0 = performance.now();
function frame(now){
  let life = val('life');
  if(animLife.checked){
    const period = 0.18*1000;
    const ph = ((now - t0) % (period*3)) / period;   // 0..3, flash then dark gap
    life = ph < 1.0 ? (1.0 - ph) : 0.0;              // 1→0 over first third, then off
    rows.life.value = life.toFixed(2);
  }
  gl.uniform1f(U.uN,        val('N'));
  gl.uniform1f(U.uRayExp,   val('rayExp'));
  gl.uniform1f(U.uSeed,     val('seed'));
  gl.uniform1f(U.uRayLife,  rayLife.checked ? 1 : 0);
  gl.uniform1f(U.uRadialExp,val('radialExp'));
  gl.uniform1f(U.uCoreMul,  val('coreMul'));
  gl.uniform1f(U.uCoreExp,  val('coreExp'));
  gl.uniform1f(U.uLife,     life);
  gl.uniform1f(U.uExposure, val('exposure'));
  gl.uniform3fv(U.uTint,    hexToRgb(tintEl.value));
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  out.textContent =
`// muzzle starburst constants
static const float N        = ${val('N').toFixed(2)};   // ${(val('N')*2)|0}-갈래
static const float RAY_EXP  = ${rayLife.checked ? 'lerp(6,14,1-life)' : val('rayExp').toFixed(2)};
static const float RADIAL_E = ${val('radialExp').toFixed(2)};
static const float CORE_MUL = ${val('coreMul').toFixed(2)};
static const float CORE_EXP = ${val('coreExp').toFixed(2)};
// per-instance: seed, life, size (정점 채널로 베이크)`;

  syncLabels();
  requestAnimationFrame(frame);
}
syncLabels();
requestAnimationFrame(frame);

document.getElementById('copyBtn').onclick = ()=> navigator.clipboard.writeText(out.textContent);
</script>
</body>
</html>
